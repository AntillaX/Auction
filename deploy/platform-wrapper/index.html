<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>PLATFORM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c0b0a'/%3E%3Cpath d='M11 20l8 24 8-24M37 20l8 24 8-24' fill='none' stroke='%23d6b06a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    /*
     * Fullscreen iframe that loads Godot's web export. We keep the export
     * untouched on disk (Platform_WebClaude.html etc.) and layer a Home link
     * on top of it so players can get back to the hub without losing the
     * Godot runtime. The iframe is same-origin, so COOP/COEP headers set by
     * nginx for /platform/ apply to both parent and frame, keeping
     * SharedArrayBuffer / threaded export happy.
     */
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .hub-link {
      position: fixed;
      top: max(0.75rem, env(safe-area-inset-top));
      left: max(0.75rem, env(safe-area-inset-left));
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.9rem 0.5rem 0.75rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ece4d4;
      background: rgba(12, 11, 10, 0.72);
      border: 1px solid rgba(214, 176, 106, 0.3);
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: color 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .hub-link svg { width: 10px; height: 10px; color: #d6b06a; }

    .hub-link:hover,
    .hub-link:focus-visible {
      color: #ecd3a0;
      border-color: rgba(214, 176, 106, 0.7);
      background: rgba(12, 11, 10, 0.9);
      outline: none;
    }
  </style>
</head>
<body>
  <a class="hub-link" href="/" aria-label="Back to platformvv hub"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg>Hub</a>
  <iframe src="Platform_WebClaude.html" allow="cross-origin-isolated; fullscreen; gamepad; autoplay"></iframe>
</body>
</html>
