<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLATFORM</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    /*
     * Fullscreen iframe that loads Godot's web export. The Godot files
     * (Platform_WebClaude.html etc.) stay untouched on disk; the wrapper
     * exists so future chrome can be layered on without editing them, and
     * so the iframe is same-origin with the COOP/COEP headers nginx sets
     * for /platform/ (required for SharedArrayBuffer). Back-to-hub
     * navigation is handled by Godot's own in-game UI.
     */
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe src="Platform_WebClaude.html" allow="cross-origin-isolated; fullscreen; gamepad; autoplay"></iframe>
</body>
</html>
